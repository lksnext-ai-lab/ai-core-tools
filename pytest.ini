[pytest]
# Pytest configuration for ia-core-tools
# Single source of truth — [tool.pytest.ini_options] in pyproject.toml is intentionally empty.

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Test paths — centralized in tests/ (unit + integration)
testpaths = tests

asyncio_mode = auto
pythonpath = backend

# Environment variables applied at collection time via pytest-env.
# pytest.ini takes precedence over pyproject.toml, so these MUST live here.
env =
    AICT_LOGIN=LOCAL
    SQLALCHEMY_DATABASE_URI=postgresql://test_user:test_pass@localhost:5433/test_db
    SECRET_KEY=test-secret-key-32chars-minimum-ok
    AICT_OMNIADMINS=admin@test.com
    AICT_MODE=SELF-HOSTED
    FRONTEND_URL=http://localhost:5173

# Markers for organizing tests
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (database, services)
    export: Export/Import functionality tests
    slow: Tests that take significant time
    api: API endpoint tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if using pytest-cov)
# addopts = --cov=backend --cov-report=html --cov-report=term
