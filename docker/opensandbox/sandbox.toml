# Default OpenSandbox server configuration for Docker runtime.
#
# Based on the upstream example config:
# https://github.com/alibaba/OpenSandbox/blob/main/server/opensandbox_server/examples/example.config.toml
#
# Compose-specific adjustments:
# - host is 0.0.0.0 so the backend service can reach opensandbox:8080
# - sqlite store path lives in the mounted opensandbox-data volume

[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400
# Optional: uncomment to enable API key authentication.
# api_key = "your-secret-api-key"
#
# If api_key stays empty, startup requires explicit acknowledgment:
# - Interactive TTY: type YES when prompted
# - Non-interactive: set OPENSANDBOX_INSECURE_SERVER=YES

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.14"

[storage]
# Allowlist of host path prefixes permitted for bind mounts.
# If empty, all host paths are allowed by OpenSandbox.
# In production, restrict this list to trusted paths.
# Example: allowed_host_paths = ["/data/opensandbox", "/tmp/sandbox"]
allowed_host_paths = []
# Default storage size for auto-created Kubernetes PVCs when caller omits size.
# Kept for schema compatibility even though this deployment uses Docker runtime.
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[docker]
# Sandboxes must share a Docker network with the OpenSandbox server when the
# backend uses use_server_proxy=true.  With this Compose file the project name is
# "docker", so the user-defined network is docker_mattin-network.
network_mode = "docker_mattin-network"
# Drop dangerous capabilities and block privilege escalation.
drop_capabilities = [
  "AUDIT_WRITE",
  "MKNOD",
  "NET_ADMIN",
  "NET_RAW",
  "SYS_ADMIN",
  "SYS_MODULE",
  "SYS_PTRACE",
  "SYS_TIME",
  "SYS_TTY_CONFIG",
]
no_new_privileges = true

# Optional: set an AppArmor profile name, e.g. "docker-default", when AppArmor is enabled.
apparmor_profile = ""

# Seccomp profile: empty string uses Docker default; set an absolute path for a custom profile.
seccomp_profile = ""

# Limit process count to reduce host impact from fork bombs; set to null to disable.
pids_limit = 4096

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.0.10"
mode = "dns"

# Experimental renew-on-access. Off by default.
[renew_intent]
enabled = false
min_interval_seconds = 60
