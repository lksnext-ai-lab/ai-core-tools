name: OpenSandbox images CI

# Builds and publishes the two custom sandbox images used by the `opensandbox`
# Compose profile (docker/docker-compose.yaml):
#   - mattinai-opensandbox-server  (docker/opensandbox/Dockerfile)
#   - mattinai-code-interpreter    (docker/opensandbox/code-interpreter/Dockerfile)
#
# Unlike backend/frontend, these rarely change and are expensive to build
# (libreoffice + multiple Jupyter kernel installs), so this only runs when
# their sources change, not on every push to develop.
on:
  push:
    branches: [develop]          # nightly builds
    paths:
      - 'docker/opensandbox/**'
      - '.github/workflows/opensandbox-ci.yml'
  pull_request:
    branches: [develop, main]    # build-only validation, no push
    paths:
      - 'docker/opensandbox/**'
      - '.github/workflows/opensandbox-ci.yml'
  release:
    types: [published]           # stable images, tagged with the release version
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }} image (and push on develop/main/tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: opensandbox-server
            image: ghcr.io/lksnext-ai-lab/mattinai-opensandbox-server
            context: docker/opensandbox
            dockerfile: docker/opensandbox/Dockerfile
          - name: code-interpreter
            image: ghcr.io/lksnext-ai-lab/mattinai-code-interpreter
            context: docker/opensandbox/code-interpreter
            dockerfile: docker/opensandbox/code-interpreter/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # nightly       → latest develop build (moving)
          # release vX.Y.Z → X.Y.Z, X.Y, and latest (latest=auto skips pre-releases
          #                  like vX.Y.Z-rc1). The leading 'v' is dropped, per the
          #                  container image tag convention.
          tags: |
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build Docker image (push on non-PR events)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
