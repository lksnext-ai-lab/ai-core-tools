name: Tests

on:
  push:
    # Feature/fix branches are covered by pull_request runs. Keeping push
    # builds for shared branches avoids running the same commit twice.
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Backend unit tests (no DB required — pure Python)
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including test group)
        run: poetry install --with test --no-interaction

      - name: Run unit tests (no DB needed)
        run: |
          poetry run pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --no-cov-on-fail
        env:
          AICT_LOGIN: LOCAL
          SQLALCHEMY_DATABASE_URI: postgresql://test_user:test_pass@localhost:5433/test_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          AICT_OMNIADMINS: admin@test.com
          AICT_MODE: SELF-HOSTED
          FRONTEND_URL: http://localhost:5173
          REPO_BASE_FOLDER: /tmp/test_repos

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: unit
          name: unit-tests
        continue-on-error: true

      - name: Store coverage report for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------------------------
  # A2A integration tests (real PostgreSQL with pgvector)
  # Scoped subset of the integration suite, which is disabled as a whole below.
  # Its coverage is fed to SonarQube together with the unit coverage.
  # -------------------------------------------------------------------------
  a2a-integration-tests:
    name: A2A Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass  # pragma: allowlist secret
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including test group)
        run: poetry install --with test --no-interaction

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5433 -U test_user && break
            echo "Waiting for PostgreSQL... ($i/20)"
            sleep 2
          done

      - name: Run A2A integration tests
        run: |
          poetry run pytest tests/integration/a2a_server/ \
            tests/integration/routers/internal/test_agent_a2a_fields.py \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage-a2a.xml \
            --no-cov-on-fail
        env:
          AICT_LOGIN: LOCAL
          SQLALCHEMY_DATABASE_URI: postgresql://test_user:test_pass@localhost:5433/test_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          AICT_OMNIADMINS: admin@test.com
          AICT_MODE: SELF-HOSTED
          FRONTEND_URL: http://localhost:5173
          REPO_BASE_FOLDER: /tmp/test_repos

      - name: Store A2A coverage report for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-a2a
          path: coverage-a2a.xml

  # -------------------------------------------------------------------------
  # Backend integration tests (real PostgreSQL with pgvector)
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: false  # Temporarily disabled until we optimize the test suite and reduce flakiness

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass  # pragma: allowlist secret
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including test group)
        run: poetry install --with test --no-interaction

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5433 -U test_user && break
            echo "Waiting for PostgreSQL... ($i/20)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          poetry run pytest tests/integration/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --no-cov-on-fail
        env:
          AICT_LOGIN: LOCAL
          SQLALCHEMY_DATABASE_URI: postgresql://test_user:test_pass@localhost:5433/test_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          AICT_OMNIADMINS: admin@test.com
          AICT_MODE: SELF-HOSTED
          FRONTEND_URL: http://localhost:5173
          REPO_BASE_FOLDER: /tmp/test_repos

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage-integration.xml
          flags: integration
          name: integration-tests
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Frontend lint (placeholder — tests added in Phase 5)
  # -------------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [unit-tests, a2a-integration-tests]
    # Still analyse when the A2A integration job fails; only its coverage is missing then.
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    permissions:
      contents: read
      pull-requests: read  # PR metadata for the analysis; decoration is done by the SonarCloud app

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Download A2A integration coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report-a2a

      # node_modules lets the TypeScript analyzer resolve types (React, etc.).
      # --ignore-scripts skips "prepare", which would build the whole library.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # The project version drives SonarCloud's "previous version" new-code period.
      - name: Read project version
        id: version
        run: echo "version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
