#NO USAR COMILLAS, si tiene '' no reconococe la propiedad
#Ya
sonar.projectKey=lks-ot-i-plus-d_mattin-ai
sonar.organization=lks-ot-i-plus-d
sonar.sourceEncoding=UTF-8

sonar.projectName=Mattin AI
# sonar.projectVersion is passed by CI from pyproject.toml, so each release
# version bump starts a new "new code" period (previous_version mode).

sonar.sources=backend,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**,frontend/src/**/__tests__/**,frontend/src/**/*.test.*,frontend/src/**/*.spec.*

sonar.python.coverage.reportPaths=coverage.xml
# The frontend has no test runner yet, so it is analysed but left out of the
# coverage metric (otherwise every frontend change fails the new-code coverage gate).
sonar.coverage.exclusions=frontend/**
sonar.sca.exclusions=uv.lock,backend/requirements*.txt,deploy/templates/client-template/frontend/package.json,deploy/templates/client-template/hello-world-plugin/package.json
sonar.exclusions=**/alembic/**,**/migrations/**,**/scripts/**,**/__pycache__/**,**/node_modules/**,**/dist/**,frontend/src/**/__tests__/**,frontend/src/**/*.test.*,frontend/src/**/*.spec.*
